<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>게시판</h1>
        </header>

        <section class="post-form-section">
            <h2>새 게시글 작성</h2>
            <form id="post-form">
                <div class="form-group">
                    <label for="post-title">제목</label>
                    <input type="text" id="post-title" required placeholder="제목을 입력하세요">
                </div>
                <div class="form-group">
                    <label for="post-content">내용</label>
                    <textarea id="post-content" rows="4" required placeholder="내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label for="post-image">사진 첨부 (5MB 이하)</label>
                    <input type="file" id="post-image" accept="image/*">
                </div>
                <button type="submit" id="post-submit-btn" class="btn">게시글 등록</button>
            </form>
        </section>

        <section class="post-list-section">
            <h2>게시글 목록</h2>
            <div id="post-list" class="post-list">
                <!-- 게시글 아이템 예시 (임시 데이터) -->
                <article class="post-item">
                    <h3 class="post-item-title">첫 번째 게시글입니다.</h3>
                    <p class="post-item-content">게시글 내용이 여기에 표시됩니다.</p>
                    <div class="post-item-image">
                        <div class="image-placeholder">이미지 영역</div>
                    </div>
                    
                    <div class="comments-section">
                        <h4>댓글</h4>
                        <ul class="comment-list">
                            <li class="comment-item">
                                <span class="comment-author">익명:</span> 좋은 글이네요!
                            </li>
                        </ul>
                        <form class="comment-form">
                            <input type="text" class="comment-input" placeholder="댓글을 입력하세요" required>
                            <button type="submit" class="btn btn-small comment-submit-btn">댓글 작성</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
