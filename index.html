<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>AI Study · 피드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 상단 네비게이션 바 -->
    <nav class="topbar">
        <div class="topbar-inner">
            <h1 class="logo">AI Study</h1>
            <button class="new-post-btn" id="open-form-btn" aria-label="새 게시글 작성">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </button>
        </div>
    </nav>

    <main class="container">
        <!-- 새 게시글 작성 카드 -->
        <section class="post-form-section" id="post-form-section">
            <div class="form-head">
                <div class="avatar avatar-me" aria-hidden="true">
                    <span>나</span>
                </div>
                <h2>새 게시글 만들기</h2>
            </div>
            <form id="post-form">
                <div class="form-group">
                    <input type="text" id="post-title" required placeholder="제목">
                </div>
                <div class="form-group">
                    <textarea id="post-content" rows="3" required placeholder="무슨 생각을 하고 계신가요?"></textarea>
                </div>
                <label for="post-image" class="file-drop">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="34" height="34" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <path d="M21 15l-5-5L5 21"></path>
                    </svg>
                    <span>사진 추가 <em>(5MB 이하)</em></span>
                    <input type="file" id="post-image" accept="image/*" hidden>
                </label>
                <p class="file-name" id="file-name" hidden></p>
                <button type="submit" id="post-submit-btn" class="btn">공유하기</button>
            </form>
        </section>

        <!-- 게시글 피드 -->
        <section class="post-list-section">
            <div id="post-list" class="post-list">
                <!-- 게시글 아이템 예시 (임시 데이터) -->
                <article class="post-item">
                    <header class="post-head">
                        <div class="avatar" aria-hidden="true"></div>
                        <span class="post-item-title">첫 번째 게시글입니다.</span>
                    </header>
                    <div class="post-item-image">
                        <div class="image-placeholder">이미지 영역</div>
                    </div>
                    <div class="post-actions">
                        <svg class="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <div class="post-body">
                        <p class="post-item-content">게시글 내용이 여기에 표시됩니다.</p>
                    </div>
                    <div class="comments-section">
                        <ul class="comment-list">
                            <li class="comment-item">
                                <span class="comment-author">익명</span> 좋은 글이네요!
                            </li>
                        </ul>
                        <form class="comment-form">
                            <input type="text" class="comment-input" placeholder="댓글 달기..." required>
                            <button type="submit" class="comment-submit-btn">게시</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
